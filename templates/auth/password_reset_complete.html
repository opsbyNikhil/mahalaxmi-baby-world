{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="bb-page bb-auth-page">
    <div class="bb-auth-wrap">
        <div class="bb-auth-card">
            <div class="bb-auth-icon"><i class="bi bi-check-circle-fill"></i></div>
            <span class="bb-hero-eyebrow">All Set</span>
            <h1>Password Reset Complete</h1>
            <p>Your password has been changed. You can now log in with your new password.</p>

            <a href="{% url 'login' %}" class="bb-btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Log In
            </a>
        </div>
    </div>
</div>
{% endblock %}
