{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">

    <title>{% block title %}Mahalaxmi Baby World{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (needed for navbar icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
        rel="stylesheet">

    <!-- Global design tokens (shared with admin dashboard theme) -->
    <style>
        :root {
            --cream: #FFF8F0;
            --pink: #FF6FA0;
            --pink-strong: #e85d8b;
            --pink-soft: #FFD3E4;
            --pink-subtle: #FFF0F5;
            --sky: #5FC9E8;
            --sky-strong: #3db8da;
            --sky-soft: #CDEFFA;
            --sky-subtle: #F0FAFD;
            --butter: #FFCB47;
            --butter-soft: #FFF3CC;
            --mint: #7EE0B8;
            --mint-soft: #D4F7E8;
            --plum: #362A4D;
            --plum-light: #5B4A72;
            --text-primary: #362A4D;
            --text-secondary: #5B4A72;
            --text-tertiary: #B0A3BF;
            --border-default: #F0E4D8;
            --border-light: #FDF3E9;

            --shadow-sm: 0 1px 3px rgba(54, 42, 77, 0.06), 0 1px 2px rgba(54, 42, 77, 0.03);
            --shadow-md: 0 4px 12px -2px rgba(54, 42, 77, 0.08), 0 2px 6px -1px rgba(54, 42, 77, 0.04);
            --shadow-lg: 0 12px 24px -6px rgba(54, 42, 77, 0.10), 0 4px 10px -4px rgba(54, 42, 77, 0.05);
            --shadow-glow-pink: 0 0 24px rgba(255, 111, 160, 0.25);

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 22px;
            --radius-pill: 999px;

            --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bouncy: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--cream);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animated background blobs, matching admin theme */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 55% at 18% 12%, rgba(255, 111, 160, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse 50% 45% at 82% 88%, rgba(95, 201, 232, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse 40% 40% at 48% 48%, rgba(255, 203, 71, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse 35% 35% at 72% 22%, rgba(126, 224, 184, 0.03) 0%, transparent 50%);
            animation: bgDrift 22s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.04) translate(-14px, 14px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }
        }

        main {
            position: relative;
        }

        body::before {
            z-index: -1;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E0D4C8;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #C4B5A8;
        }
    </style>

    <!-- Custom CSS (loaded after Bootstrap so overrides win) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">

    {% block css %}{% endblock %}
</head>

<body>

    {% include 'navbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    {% block js %}{% endblock %}

</body>

</html>
